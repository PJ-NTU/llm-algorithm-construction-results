<svg xmlns="http://www.w3.org/2000/svg" width="980" height="118" viewBox="0 0 980 118" role="img" aria-label="Headline results: 84% of the 169 comparable FrontierOR tasks match or beat Gurobi, with 60 s per instance against Gurobi's one hour; FrontierOR solution quality 0.88 against 0.67 for the best published method; CO-Bench average score 0.970, the highest of ten methods; 567 problems in the record library; 37 of 56 benchmark problems improved by continued evolution."><style>text{font-family:-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}</style><g><rect x="14.0" y="10" width="26" height="3.5" rx="1.75" fill="#6ea6dc" /><text x="14.0" y="56" font-size="36" font-weight="650" letter-spacing="-0.5" fill="#f0f6fc">84%</text><text x="14.0" y="82" font-size="13" fill="#9198a1">of FrontierOR tasks match</text><text x="14.0" y="100" font-size="13" fill="#6e7681">or beat Gurobi, 60 s vs 1 h</text></g><g><rect x="210.0" y="10" width="26" height="3.5" rx="1.75" fill="#6ea6dc" /><text x="210.0" y="56" font-size="36" font-weight="650" letter-spacing="-0.5" fill="#f0f6fc">0.88</text><text x="210.0" y="82" font-size="13" fill="#9198a1">FrontierOR solution quality</text><text x="210.0" y="100" font-size="13" fill="#6e7681">best published: 0.67</text></g><path d="M190.0 14 V104" stroke="#3d444d" stroke-width="1" /><g><rect x="406.0" y="10" width="26" height="3.5" rx="1.75" fill="#7fbf77" /><text x="406.0" y="56" font-size="36" font-weight="650" letter-spacing="-0.5" fill="#f0f6fc">0.970</text><text x="406.0" y="82" font-size="13" fill="#9198a1">CO-Bench average score</text><text x="406.0" y="100" font-size="13" fill="#6e7681">highest of ten methods</text></g><path d="M386.0 14 V104" stroke="#3d444d" stroke-width="1" /><g><rect x="602.0" y="10" width="26" height="3.5" rx="1.75" fill="#d4a660" /><text x="602.0" y="56" font-size="36" font-weight="650" letter-spacing="-0.5" fill="#f0f6fc">567</text><text x="602.0" y="82" font-size="13" fill="#9198a1">proble